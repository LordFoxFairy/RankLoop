name: rankloop

services:
  api:
    build:
      context: .
      target: runner
    image: ghcr.io/lordfoxfairy/rankloop:${RANKLOOP_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 8080
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 平台根域名：租户站点按 <slug>.<该域名> 路由
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-rankloop.miaokit.cloud}
      # 初始管理员，由 seed 脚本读取
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # 配置后才会启动 Search Console 自动同步：提交 sitemap 并每日回读
      # 点击/曝光/排名。缺了它，闭环止步于「发布」，看不到发布后的效果。
      GSC_SERVICE_ACCOUNT: ${GSC_SERVICE_ACCOUNT:-}
      # Core Web Vitals 数据源。不配则不采集——面板会说明未配置，
      # 而不是显示一排 0 让人以为性能极差。
      CRUX_API_KEY: ${CRUX_API_KEY:-}
      DEFAULT_MAX_SITES: ${DEFAULT_MAX_SITES:-5}
      DEFAULT_MAX_CONTENTS: ${DEFAULT_MAX_CONTENTS:-1000}
      DEFAULT_DAILY_INDEXNOW: ${DEFAULT_DAILY_INDEXNOW:-200}
      DEFAULT_MAX_WEBHOOKS: ${DEFAULT_MAX_WEBHOOKS:-10}
    # 不对公网暴露，由反代转发（规格 §12.3）。
    #
    # 绑定地址必须可覆盖，且默认值救不了生产：反代 OpenResty 自己也在容器里，
    # 绑到 127.0.0.1 时它连不上（那是宿主的回环，不是容器的），结果是 502。
    # 生产绑 docker 网桥网关 172.17.0.1——仅内网可达，公网仍然进不来。
    #
    # 端口同理：部署机上 8080 已被既有服务（sub2api）占用，硬编码会起不来。
    # 生产用 HOST_BIND=172.17.0.1 + HOST_PORT=8082，与 OpenResty
    # tenant-sites.conf 的 proxy_pass 一致；两处不一致就是 502。
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 独立的一次性迁移任务，避免多实例并发迁移（规格 §10.3）
  migrate:
    build:
      context: .
      target: runner
    image: ghcr.io/lordfoxfairy/rankloop:${RANKLOOP_TAG:-main}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 不映射到公网（规格 §10.3、§13.4）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 临时公网隧道（可选）：让控制台在手机等设备上也能打开，无需任何账号。
  # 用 profiles 隔离——默认不启动，需要时执行：
  #   docker compose --profile tunnel up -d
  #   docker compose logs tunnel | grep trycloudflare
  # 地址随机且每次重启都变；长期在线请用 render.yaml 部署。
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8080"]
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
  redis_data:
