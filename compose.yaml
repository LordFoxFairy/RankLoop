name: rankloop

services:
  api:
    build:
      context: .
      target: runner
    image: ghcr.io/lordfoxfairy/rankloop:${RANKLOOP_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 8080
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 平台根域名：租户站点按 <slug>.<该域名> 路由
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-rankloop.miaokit.cloud}
      # 初始管理员，由 seed 脚本读取
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DEFAULT_MAX_SITES: ${DEFAULT_MAX_SITES:-5}
      DEFAULT_MAX_CONTENTS: ${DEFAULT_MAX_CONTENTS:-1000}
      DEFAULT_DAILY_INDEXNOW: ${DEFAULT_DAILY_INDEXNOW:-200}
      DEFAULT_MAX_WEBHOOKS: ${DEFAULT_MAX_WEBHOOKS:-10}
    # 只绑定回环地址，由反代对外暴露（规格 §12.3）
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 独立的一次性迁移任务，避免多实例并发迁移（规格 §10.3）
  migrate:
    build:
      context: .
      target: runner
    image: ghcr.io/lordfoxfairy/rankloop:${RANKLOOP_TAG:-main}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 不映射到公网（规格 §10.3、§13.4）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
  redis_data:
